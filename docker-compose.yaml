name: kakeibo-app

services:
  # 1. データベース (PostgreSQL)
  db:
    image: postgres:15
    container_name: kakeibo-db
    environment:
      POSTGRES_DB: kakeibo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # 2. バックエンド (SpringBoot)
  backend:
    build:
      context: ./kakeibo-backend  # SpringBootのDockerfileがあるフォルダパス
    container_name: kakeibo-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/kakeibo_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db

  # 3. フロントエンド (Next.js)
  frontend:
    build:
      context: ./kakeibo-frontend # Next.jsのDockerfileがあるフォルダパス
    container_name: kakeibo-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

# データベースのデータをPC内に永続保存するための設定
volumes:
  db_data: